[project]
name = "cda-dust-analyzer"
version = "0.1.0"
description = "CDA Dust Analyzer Agent built with Google ADK for Time-of-Flight mass spectra classification."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "google-genai>=0.2.0",
    "google-cloud-aiplatform>=1.60.0",
    "google-cloud-storage>=2.18.0",
    "google-adk>=1.14",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "scikit-learn>=1.3.0",
    "huggingface-hub>=0.23.0",
    "tqdm>=4.66.0",
    "pyarrow>=14.0.0",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "numpy",
    "ipython",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
